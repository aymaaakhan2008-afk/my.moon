<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Moon</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1f;--panel:rgba(14,16,48,.9);--ink:#f4f6ff;--muted:#b4bfe6;--line:#4a4fa0;--accent:#ff9a3d;--accent-ink:#1b1100;--good:#58e8a8;--bad:#ff6b7a;--track:#2a2f66;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(14,16,48,.9)}}
:root[data-theme="dark"]{--panel:rgba(14,16,48,.9)}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:#070a1f;color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.35;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#al{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 10px rgba(255,40,70,0);transition:box-shadow .4s}body.al #al{box-shadow:inset 0 0 90px 10px rgba(255,40,70,.55)}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 0;pointer-events:none}
.bar{display:flex;justify-content:space-between;font-weight:600;text-shadow:0 1px 4px #000;font-size:.95rem}.bar small{color:var(--muted);font-weight:400}
.prog{height:5px;border-radius:9px;background:var(--track);margin:3px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff9a3d,#ff4fa0);border-radius:9px}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.m{background:var(--panel);border:2px solid var(--line);border-radius:11px;padding:2px 6px;font-size:.8rem;font-weight:600}
.track{height:7px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:2px}.fill{height:100%;border-radius:9px;transition:width .2s}
.hz{margin-top:5px;border-radius:11px;background:#6b1022;border:2px solid var(--bad);padding:3px 9px;font-weight:600;font-size:.8rem}
.hz u{display:block;height:4px;background:var(--bad);border-radius:4px;margin-top:2px;text-decoration:none}
#zb{position:fixed;right:8px;top:50%;transform:translateY(-70%);display:flex;flex-direction:column;gap:6px}
#zb button{width:40px;height:40px;margin:0;padding:0;text-align:center;font-size:1.2rem;background:var(--panel)}
.lb{position:fixed;left:0;top:0;pointer-events:none;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:99px;background:rgba(10,12,40,.8);border:2px solid #fff;white-space:nowrap;text-shadow:0 1px 2px #000}
.lb.hzl{background:#a01030;border-color:#fff}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);backdrop-filter:blur(6px)}
#log{display:flex;gap:8px;align-items:center;min-height:46px;font-size:.82rem;margin-bottom:6px}#log b{color:var(--accent)}
#cr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#st{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:#1a1f55;color:var(--ink);padding:5px;margin:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:flex;flex-direction:column;align-items:center;font-size:.7rem;line-height:1.15}.chip b{font-size:.78rem}.chip.on{border-color:var(--accent);background:#3a2a58}
.sb{display:flex;flex-direction:column;align-items:center;font-size:.68rem}.sb i{font-style:normal;font-size:1.2rem}.sb.hzb{border-color:var(--bad);background:#6b1022}
.sb .track{width:100%}
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(4,5,20,.65)}
.cd{background:#141a52;border:3px solid var(--accent);border-radius:20px;padding:16px;max-width:520px;max-height:86%;overflow:auto;user-select:text}
.cd h1{margin:0 0 6px;font-size:1.7rem;line-height:1.1}.cd p{margin:0 0 8px}
.cd .go{width:100%;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1.05rem;padding:10px;margin-top:6px}
.fact{border-left:5px solid #4fd8ff;padding-left:10px;margin:8px 0;font-size:.92rem}
.tm{display:flex;gap:6px;justify-content:space-between;text-align:center;font-size:.7rem;margin:8px 0}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="al"></div><div id="lbs"></div>
<div id="hud"></div><div id="zb"><button aria-label="Zoom in" onclick="zoom(.75)">＋</button><button aria-label="Zoom out" onclick="zoom(1.33)">－</button><button aria-label="Reset view" onclick="foc('base')">⌂</button></div>
<div id="dock"><div id="log"></div><div id="cr"></div><div id="st"></div></div>
<div id="card"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)},DAY=9;
var MT=[{k:"o",n:"Air",i:"🫁",c:"#4fd8ff"},{k:"p",n:"Power",i:"⚡",c:"#ffd84a"},{k:"f",n:"Food",i:"🌱",c:"#5cff8a"},{k:"s",n:"Shield",i:"🛡️",c:"#7a9bff"}];
var SN={o:"Air",p:"Power",f:"Garden",s:"Shield",b:"Build"},SI={o:"🫁",p:"⚡",f:"🌱",s:"🛡️",b:"🏗️"},SC={o:0x4fd8ff,p:0xffd84a,f:0x5cff8a,s:0x7a9bff,b:0xff9a3d};
function AV(c,k){return '<svg viewBox="0 0 64 64" width="'+k+'" height="'+k+'" aria-hidden="true"><rect x="14" y="31" width="36" height="28" rx="12" fill="'+c+'"/><rect x="7" y="35" width="11" height="18" rx="5" fill="#f1f3ff"/><rect x="46" y="35" width="11" height="18" rx="5" fill="#f1f3ff"/><rect x="22" y="41" width="20" height="8" rx="3" fill="#fff" opacity=".8"/><circle cx="32" cy="22" r="17" fill="#f6f7ff" stroke="#c4cbe4" stroke-width="2"/><ellipse cx="32" cy="23" rx="11.5" ry="9.5" fill="#14275c"/><ellipse cx="28" cy="20" rx="4" ry="2.4" fill="#7db4ff" opacity=".8"/><circle cx="32" cy="6" r="3" fill="'+c+'"/></svg>'}
function RB(c,k){return '<svg viewBox="0 0 64 64" width="'+k+'" height="'+k+'" aria-hidden="true"><rect x="12" y="30" width="40" height="18" rx="6" fill="'+c+'"/><rect x="18" y="14" width="28" height="18" rx="6" fill="#eef0f8"/><circle cx="26" cy="23" r="4" fill="#00cfff"/><circle cx="38" cy="23" r="4" fill="#00cfff"/><rect x="31" y="5" width="2" height="9" fill="#aab"/><circle cx="32" cy="5" r="3" fill="#ff3355"/><circle cx="20" cy="52" r="7" fill="#333"/><circle cx="44" cy="52" r="7" fill="#333"/></svg>'}
var CR=[{n:"Nova",r:"Commander",ic:"⭐",col:"#ff6b3d",hex:0xff6b3d,b:{s:2},best:"Shield ×2"},{n:"Kai",r:"Engineer",ic:"🔧",col:"#ffd23d",hex:0xffd23d,b:{p:2,b:2},best:"Power, Build ×2"},{n:"Amara",r:"Botanist",ic:"🌱",col:"#3ddc97",hex:0x3ddc97,b:{f:2,o:1.5},best:"Garden ×2"},{n:"Dusty",r:"Robot",ic:"🤖",col:"#5ad7ff",hex:0x5ad7ff,b:{fix:2.5,o:1.5},best:"Repairs ×2.5"}];
function face(i,k){return i==3?RB(CR[3].col,k):AV(CR[i].col,k)}
var MC='<svg viewBox="0 0 64 64" width="38" height="38"><circle cx="32" cy="32" r="24" fill="#2a6fdb"/><path d="M20 22q8-8 14 0t-4 12-10-2zM38 38q8-2 10 6t-8 6z" fill="#4aa860"/></svg>';
var HOME=[[-1,4.5],[1,5.4],[3,4.6],[-3,5]],SPOS={o:[-4,8],p:[-6.5,-1],f:[6.5,4.8],s:[3.5,-5.5]};
var PJ=[{n:"Solar Farm",ic:"☀️",need:45,pos:[-17,10],bn:"Power use −35% for the rest of the mission.",dn:"Rows of panels unfold and the whole base hums with power.",fa:"Solar panels are launched folded up, then unfold in space. On the Moon they get strong sunlight but have no air to make clouds."},
{n:"Moon Farm",ic:"🥕",need:50,pos:[18,-6],bn:"Food use −40% for the rest of the mission.",dn:"Green leaves glow under the grow lights. Dinner just got easier!",fa:"Plants can’t grow in raw Moon soil, so Moon farms use trays with water, nutrients and special lights."},
{n:"Night Shelter",ic:"🏠",need:55,pos:[0,-17],bn:"Night power drain is capped for the rest of the mission.",dn:"A thick dust-covered shelter keeps heat and radiation out.",fa:"Piling regolith (Moon soil) over a shelter is a real idea: it blocks radiation and holds heat."},
{n:"Earth Link Tower",ic:"📡",need:60,pos:[-15,-14],bn:"Call Earth to win!",dn:"The dish turns toward Earth and sends your message across space.",fa:"Radio waves travel at the speed of light. Earth is about 384,400 km from the Moon, so a message takes about 1.3 seconds."}];
var CH=[{n:"Power Up",d:{o:.7,p:.7,f:.6,s:.4},sun:1.5,st:"Your lander touched down near the Moon’s south pole, where NASA’s Artemis program plans to explore. Mission Control has a four-part plan. First, build a Solar Farm so the base has power.",ti:"Moon gravity is only about one sixth of Earth’s, and the sky is black even at noon because there is no air."},
{n:"Grow Food",d:{o:.8,p:.8,f:.7,s:.5},sun:1.5,st:"Supplies are running low. Build a Moon Farm. Rocks and radiation can hit at any time, so keep the base safe while you build.",ti:"The Moon has no atmosphere or magnetic field, so radiation and space rocks hit the surface directly."},
{n:"Survive the Night",d:{o:.8,p:1.5,f:.7,s:.5},sun:.04,st:"The Sun has set. Most places on the Moon stay dark for about 14 Earth days. Solar panels make no power and it is about −173 °C outside. Build a Night Shelter.",ti:"The Moon’s surface can reach about 127 °C at noon and drop to about −173 °C at night."},
{n:"Call Earth",d:{o:.8,p:.9,f:.8,s:.5},sun:1.5,st:"Dawn! Sunlight is back. One last project: raise the Earth Link Tower and send your message home before day 24.",ti:"A full day-night cycle on the Moon lasts about 29.5 Earth days."}];
var HZ={leak:{st:"o",i:"💨",n:"Air leak!",t:"Hiss! Cabin pressure is dropping.",pen:{o:-12},dr:{o:1.3},why:"Habitats are pressurized because people can’t breathe in a vacuum. Sealing leaks fast keeps the air in."},
dust:{st:"p",i:"🌫️",n:"Dusty panels!",t:"Moon dust is covering the solar panels.",pen:{p:-8},dr:{p:1.1},why:"Moon dust is sharp and sticky with static electricity. It dims solar panels like dirt on a window."},
storm:{st:"s",i:"☀️",n:"Solar flare!",t:"A radiation burst is racing toward the base.",pen:{s:-30},dr:{},why:"Solar flares throw fast particles into space. Thick shielding and storm shelters protect astronauts from radiation."},
blight:{st:"f",i:"🍂",n:"Plants wilting!",t:"The greenhouse water filter is clogged.",pen:{f:-10},dr:{f:1.2},why:"Plants need clean water and nutrients. Space crews watch their gardens closely because food can’t be resupplied quickly."},
rock:{st:"s",i:"☄️",n:"Space rock hit!",t:"A meteoroid cracked the outer wall.",pen:{s:-10},dr:{s:1.1,o:.3},why:"Even grain-sized meteoroids move about 20 km/s. With no air to slow them down, walls need repair fast."},
cold:{st:"p",i:"🧊",n:"Frozen cables!",t:"The power cables are freezing in the lunar night.",pen:{p:-8},dr:{p:1.5},why:"Moon rock holds little heat, so the ground cools very fast at night. Heaters and insulation keep machines working."}};
var AL=[["leak","dust","storm"],["leak","dust","storm","blight","rock"],["cold","leak","rock","blight","cold"],["storm","dust","rock","blight"]];
var TX={o:"making air! Electrolysis splits water into oxygen and hydrogen using electricity, just like on the space station.",p:"tilting the panels! They only make power facing the Sun, and a lunar night lasts about 14 Earth days.",f:"tending the plants! They breathe in CO₂ and give out oxygen, so a garden makes food and air. Astronauts ate space-grown lettuce in 2015.",s:"piling Moon dust on the walls! With no air or magnetic field here, radiation and space rocks hit directly."};
var S,CB;
function newS(){return {run:0,t:0,day:1,ch:0,v:{o:75,p:75,f:75,s:75},st:{},haz:[],pj:[0,0,0,0],done:[0,0,0,0],crew:CR.map(function(c,i){return {x:HOME[i][0],z:HOME[i][1],ry:0,task:null,arr:1}}),sel:0,nxt:15,said:{},beam:0,tc:0}}
function curP(){for(var i=0;i<=S.ch;i++)if(!S.done[i])return i;return -1}
function tgt(i,k){if(k==="b"){var p=curP();if(p<0)return HOME[i];var q=PJ[p].pos;return [q[0]+(i-1.5)*1.3+3,q[1]+4]}if(!k)return HOME[i];var s=SPOS[k];return [s[0]+(i%2)*1.4-.7,s[1]+(i>1?1:0)]}
function drain(k){var r=CH[S.ch].d[k];if(k==="p"){if(S.done[0])r*=.65;if(S.ch==2&&S.done[2])r=Math.min(r,.9)}if(k==="f"&&S.done[1])r*=.6;for(var id in S.st)r+=HZ[id].dr[k]||0;return r}
function say(i,t){$("log").innerHTML=(i>3?MC:face(i,38))+'<div><b>'+(i>3?"Mission Control":CR[i].n)+':</b> '+t+'</div>'}
function card(h,b,f){CB=f;S.run=0;var c=$("card");c.innerHTML='<div class="cd">'+h+'<button class="go" onclick="cb()">'+b+'</button></div>';c.style.display="flex"}
function cb(){$("card").style.display="none";var f=CB;CB=null;if(f)f()}
function build(){$("cr").innerHTML=CR.map(function(c,i){return '<button class="chip" id="c'+i+'" onclick="sel('+i+')">'+face(i,34)+'<b>'+c.ic+' '+c.n+'</b><span id="t'+i+'">Idle</span></button>'}).join("");
 $("st").innerHTML=["o","p","f","s","b"].map(function(k){return '<button class="sb" id="s'+k+'" onclick="go(\''+k+'\')"><i>'+SI[k]+'</i>'+SN[k]+'<div class="track"><div class="fill" id="f'+k+'" style="width:0;background:'+(k=="b"?"#ff9a3d":MT.filter(function(m){return m.k==k})[0].c)+'"></div></div></button>'}).join("")+'<button class="sb" onclick="go(null)"><i>🏠</i>Rest</button>'}
function sel(i){S.sel=i;ui()}
function go(k){var i=S.sel,c=S.crew[i];if(!S.run)return;if(k==="b"&&curP()<0){say(4,"Every project available right now is done. New ones unlock with the next chapter.");return}
 c.task=k;if(k){var first=!S.said[k+(k==="b"?curP():"")];S.said[k+(k==="b"?curP():"")]=1;say(i,first?(k==="b"?PJ[curP()].fa.split(".")[0]+". Building the "+PJ[curP()].n+"!":TX[k]):"Heading to "+SN[k]+"!")}else say(i,"Taking a break at the habitat.");
 var n=S.crew.findIndex(function(x,j){return !x.task&&j!==i});if(n>-1)S.sel=n;ui()}
function ui(){var d=CH[S.ch],cp=curP(),pp=PJ[cp<0?S.ch:cp],pr=cp<0?100:Math.round(S.pj[cp]/pp.need*100),low=false;
 var hz=S.haz.map(function(h){var z=HZ[h.id];return '<div class="hz">'+z.i+' '+z.n+' '+(h.late?'Still broken! Fix it at ':'Send crew to ')+SN[z.st]+(h.late?"":" · "+Math.ceil(h.tm)+"s")+'<u style="width:'+(h.late?100:h.tm/14*100)+'%"></u></div>'}).join("");
 $("hud").innerHTML='<div class="bar"><span>My Moon · '+d.n+'</span><small>Day '+S.day+'/24</small></div><div class="prog"><i style="width:'+S.t/(DAY*24)*100+'%"></i></div><div class="ms">'+MT.map(function(m){var v=Math.round(S.v[m.k]);if(v<25)low=true;return '<div class="m">'+m.i+' '+v+'<div class="track"><div class="fill" style="width:'+v+'%;background:'+(v<25?"#ff6b7a":m.c)+'"></div></div></div>'}).join("")+'</div><div class="bar" style="margin-top:4px;font-size:.82rem"><span>'+pp.ic+' '+pp.n+' '+pr+'%</span><small>'+S.done.filter(Boolean).length+'/4 projects</small></div>'+hz;
 document.body.classList.toggle("al",low||S.haz.some(function(h){return !h.late}));
 S.crew.forEach(function(c,i){$("c"+i).className="chip"+(S.sel===i?" on":"");$("t"+i).textContent=c.task?SI[c.task]+" "+SN[c.task]:"💤 Idle"});
 ["o","p","f","s"].forEach(function(k){$("f"+k).style.width=Math.round(S.v[k])+"%";$("s"+k).className="sb"+(S.haz.some(function(h){return HZ[h.id].st===k})?" hzb":"")});
 $("fb").style.width=pr+"%"}
function chapter(){var d=CH[S.ch],p=PJ[S.ch];card('<h1>Chapter '+(S.ch+1)+': '+d.n+'</h1><p>'+d.st+'</p><p><b>Goal:</b> '+p.ic+' build the '+p.n+'.</p><div class="fact"><b>🔬 Space fact:</b> '+d.ti+'</div><p style="color:var(--muted);font-size:.88rem">Tap a crew member, then tap a station (or a building in the 3D world). Keep all four meters above zero while you build.</p>',"Let’s go!",function(){S.run=1;ui()})}
function projDone(i){S.done[i]=1;S.crew.forEach(function(c){if(c.task==="b")c.task=null});
 if(i===3){S.beam=1;S.run=0;setTimeout(function(){card('<h1>📡 Message sent!</h1><p>Your signal crosses 384,400 km of space to Earth in about 1.3 seconds. Mission Control cheers: “My Moon, we hear you loud and clear!”</p><p><b>You won in '+S.day+' days</b> with base health '+Math.round((S.v.o+S.v.p+S.v.f+S.v.s)/4)+'/100.</p>',"Play again",restart)},4500);return}
 card('<h1>✅ '+PJ[i].n+' complete!</h1><p>'+PJ[i].dn+'</p><p><b>Bonus:</b> '+PJ[i].bn+'</p><div class="fact"><b>🔬 Space fact:</b> '+PJ[i].fa+'</div>',"Continue",function(){S.run=1;ui()})}
function late(h){var z=HZ[h.id];h.late=1;for(var k in z.pen)S.v[k]=Math.max(0,S.v[k]+z.pen[k]);
 if(Object.keys(z.dr).length){S.st[h.id]=1;say(4,"Too slow! "+z.n+" It keeps draining until someone fixes it at "+SN[z.st]+".")}else{h.gone=1;say(4,"The flare hit the base. "+z.why)}}
function solve(h){var z=HZ[h.id];h.gone=1;delete S.st[h.id];S.v[z.st]=Math.min(100,S.v[z.st]+8);say(4,"✅ Fixed! "+z.why)}
function lose(k){var m={o:"The air ran out. Oxygen is the first thing a crew needs. Keep someone at the Air station.",p:"Power failed and life support stopped. Keep panels clear and tilted at the Sun.",f:"The food ran out. Plants take time to grow, so tend the garden early.",s:"The shield failed and radiation flooded in. Keep the walls thick and fix cracks fast."};
 card('<h1>🛰️ Mission failed</h1><p>'+m[k]+'</p><p>Day '+S.day+' of 24 · '+S.done.filter(Boolean).length+' of 4 projects done.</p>',"Try again",restart)}
function restart(){var o=S;S=newS();S.sel=0;build();ui();if(window.foc)foc("far");intro()}
function intro(){card('<h1>My Moon 🌙</h1><p>You are the commander of a four-person crew landing on the Moon. In 24 days you must build four projects, ending with a tower that calls Earth.</p><p>Each crew member is best at a different job:</p><div class="tm">'+CR.map(function(c,i){return '<div>'+face(i,46)+'<br><b>'+c.ic+' '+c.n+'</b><br>'+c.best+'</div>'}).join("")+'</div><p>Air, power, food and shield drain all the time. Send your crew to stations to keep them up, or to the build site to finish projects. Alarms ring at random!</p>',"Start mission",function(){if(window.foc)foc("base");chapter()})}
function tick(dt){if(!S.run)return;S.t+=dt;var d=1+Math.floor(S.t/DAY);
 if(d>24){S.run=0;card('<h1>⏰ Time’s up</h1><p>Day 24 passed before the Earth Link Tower was finished. You completed '+S.done.filter(Boolean).length+' of 4 projects.</p>',"Try again",restart);return}
 if(d!==S.day){S.day=d;var ch=Math.min(3,Math.floor((d-1)/6));if(ch!==S.ch){S.ch=ch;chapter();ui();return}}
 MT.forEach(function(m){S.v[m.k]=Math.max(0,S.v[m.k]-drain(m.k)*dt)});
 S.crew.forEach(function(c,i){var t=c.task,g=tgt(i,t),dx=g[0]-c.x,dz=g[1]-c.z,dist=Math.hypot(dx,dz);c.arr=dist<.2;
  if(!c.arr){var sp=Math.min(dist,(i==3?6:7.5)*dt);c.x+=dx/dist*sp;c.z+=dz/dist*sp;c.ry=Math.atan2(dx,dz)}
  else if(t){var b=CR[i].b;if(t==="b"){var p=curP();if(p>-1){S.pj[p]+=dt*(b.b||1);if(S.pj[p]>=PJ[p].need)projDone(p)}}else S.v[t]=Math.min(100,S.v[t]+3.5*(b[t]||1)*dt)}});
 S.haz.forEach(function(h){var z=HZ[h.id],w=0;if(!h.late){h.tm-=dt;if(h.tm<=0)late(h)}
  S.crew.forEach(function(c,i){if(c.arr&&c.task===z.st)w+=CR[i].b.fix||1});h.fix+=w*dt;if(!h.gone&&h.fix>=3)solve(h)});
 S.haz=S.haz.filter(function(h){return !h.gone});
 if(S.t>S.nxt&&S.haz.length<2){var al=AL[S.ch].filter(function(k){return !S.haz.some(function(h){return h.id===k})});if(al.length){var id=al[Math.floor(Math.random()*al.length)];S.haz.push({id:id,tm:14,fix:0,late:0});S.nxt=S.t+10+Math.random()*7-S.ch;say(4,"🚨 "+HZ[id].t+" Send a crew member to "+SN[HZ[id].st]+"!");S.alarm=id;if(window.foc){foc(HZ[id].st);setTimeout(function(){foc("base")},2600)}}}
 for(var k in S.v)if(S.v[k]<=0){S.run=0;lose(k);return}}
/* ---------- 3D ---------- */
